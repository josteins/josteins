<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contribution Ranking</title>
<meta name="description" content="Jostein Svendsen's GitHub contributions, ranked against the most active developers in Norway and the UK, updated weekly.">
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
  --grid: #e1e0d9; --axis: #c3c2b7; --ring: rgba(11,11,11,0.10);
  --s1: #2a78d6; --s2: #eb6834; --deemph: #d6d5ce; --up: #006300;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --ring: rgba(255,255,255,0.10);
    --s1: #3987e5; --s2: #d95926; --deemph: #3d3d3a; --up: #0ca30c;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
  --grid: #2c2c2a; --axis: #383835; --ring: rgba(255,255,255,0.10);
  --s1: #3987e5; --s2: #d95926; --deemph: #3d3d3a; --up: #0ca30c;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--ink);
  font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
main { max-width: 1040px; margin: 0 auto; padding: 40px 16px 64px; }
header h1 { font-size: 28px; line-height: 1.2; margin: 0 0 6px; font-weight: 650; letter-spacing: -0.01em; }
header p { margin: 0; color: var(--ink-2); }
header a, footer a { color: inherit; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin: 28px 0; }
.card { background: var(--surface); border: 1px solid var(--ring); border-radius: 12px; padding: 18px 20px; }
.kpi .label { color: var(--ink-2); font-size: 13px; }
.kpi .value { font-size: 34px; font-weight: 650; line-height: 1.15; margin-top: 4px; }
.kpi.hero .value { font-size: 52px; }
.kpi .sub { color: var(--muted); font-size: 13px; margin-top: 4px; }
.kpi .delta { color: var(--up); }
section.card { margin-top: 16px; }
section h2 { font-size: 17px; margin: 0; font-weight: 650; }
section .desc { color: var(--ink-2); margin: 2px 0 14px; font-size: 14px; }
.row { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; margin-bottom: 10px; }
.legend { display: flex; gap: 16px; font-size: 13px; color: var(--ink-2); }
.legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 2px;
  background: var(--c); margin-right: 6px; vertical-align: -1px; }
.seg { display: inline-flex; border: 1px solid var(--ring); border-radius: 8px; padding: 2px; }
.seg button { font: inherit; font-size: 13px; color: var(--ink-2); background: none; border: 0; border-radius: 6px;
  padding: 4px 10px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--page); color: var(--ink); font-weight: 600; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.two section.card { margin-top: 16px; }
@media (max-width: 760px) { .two { grid-template-columns: 1fr; } .kpi.hero .value { font-size: 44px; } }
.chart { position: relative; width: 100%; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart text { font-family: inherit; }
.tip { position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--ring);
  border-radius: 8px; padding: 8px 10px; font-size: 13px; box-shadow: 0 4px 16px rgba(0,0,0,0.12);
  opacity: 0; transition: opacity .08s; white-space: nowrap; z-index: 2; }
.tip .t { color: var(--ink-2); margin-bottom: 2px; }
.tip .r { display: flex; align-items: center; gap: 8px; }
.tip .r b { font-weight: 650; }
.tip .k { width: 12px; height: 2px; background: var(--c); border-radius: 1px; }
.tip .r .n { color: var(--ink-2); }
.hit { fill: transparent; cursor: default; }
.hit:focus { outline: none; }
.mark { transition: opacity .1s; }
details { margin-top: 10px; font-size: 13px; color: var(--ink-2); }
summary { cursor: pointer; }
table { border-collapse: collapse; margin-top: 8px; width: 100%; font-variant-numeric: tabular-nums; }
th, td { text-align: right; padding: 4px 8px; border-bottom: 1px solid var(--grid); }
th:first-child, td:first-child { text-align: left; }
th { color: var(--muted); font-weight: 500; }
.note { color: var(--muted); font-size: 13px; }
.empty { color: var(--ink-2); font-size: 14px; padding: 24px 0; }
footer { margin-top: 28px; color: var(--muted); font-size: 13px; }
footer li { margin-bottom: 4px; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Contribution ranking</h1>
    <p id="subtitle"></p>
  </header>
  <div class="kpis" id="kpis"></div>

  <section class="card">
    <div class="row" style="justify-content: space-between">
      <div><h2 id="monthly-title">Month by month</h2></div>
      <div class="seg" id="metric" role="group" aria-label="Metric"></div>
    </div>
    <p class="desc" id="monthly-desc"></p>
    <div class="legend" id="monthly-legend"></div>
    <div class="chart" id="monthly"></div>
    <details><summary>Show data table</summary><div id="monthly-table"></div></details>
  </section>

  <div class="two" id="boards"></div>

  <section class="card">
    <h2>Rank over time</h2>
    <p class="desc">Jostein's place on each leaderboard, one point per weekly update.</p>
    <div class="legend" id="trend-legend"></div>
    <div class="chart" id="trend"></div>
    <details><summary>Show data table</summary><div id="trend-table"></div></details>
  </section>

  <footer>
    <ul id="notes"></ul>
  </footer>
</main>
<script>
const DATA = /*__DATA__*/null;
const S = DATA.snapshot, H = DATA.history;
const NS = "http://www.w3.org/2000/svg";
const people = S.people;
const hero = people.find(p => p.key === DATA.hero);
const others = people.filter(p => p !== hero);
const COLOR = { jostein: "var(--s1)", sean: "var(--s2)" };
const fmt = n => n.toLocaleString("en-US");
const compact = n => n >= 1e6 ? (n / 1e6).toFixed(1) + "M" : n >= 1e4 ? Math.round(n / 1e3) + "K" : n >= 1e3 ? (n / 1e3).toFixed(1).replace(".0", "") + "K" : String(n);
const monthName = (iso, long) => new Date(iso + "T00:00:00Z").toLocaleString("en-GB", { month: long ? "long" : "short", year: long ? "numeric" : undefined, timeZone: "UTC" });
const dateName = iso => new Date(iso + "T00:00:00Z").toLocaleString("en-GB", { day: "numeric", month: "short", year: "numeric", timeZone: "UTC" });

function el(tag, attrs, parent, text) {
  const e = tag.startsWith("svg:") ? document.createElementNS(NS, tag.slice(4)) : document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) e.setAttribute(k, v);
  if (text != null) e.textContent = text;
  if (parent) parent.appendChild(e);
  return e;
}
function niceMax(v) {
  if (v <= 0) return 1;
  const p = Math.pow(10, Math.floor(Math.log10(v))), f = v / p;
  return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p;
}
// Bar with a 4px rounded data-end, square at the baseline.
function barPath(x, y, w, h, horizontal) {
  const r = Math.max(0, Math.min(4, (horizontal ? h : w) / 2, horizontal ? w : h));
  if (horizontal) return `M${x},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h - r}Q${x + w},${y + h} ${x + w - r},${y + h}H${x}Z`;
  return `M${x},${y + h}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h}Z`;
}
function tooltip(box) {
  const tip = el("div", { class: "tip", role: "status" }, box);
  return {
    show(evtOrEl, title, rows) {
      tip.replaceChildren();
      el("div", { class: "t" }, tip, title);
      for (const r of rows) {
        const row = el("div", { class: "r" }, tip);
        if (r.color) { const k = el("span", { class: "k" }, row); k.style.setProperty("--c", r.color); }
        el("b", {}, row, r.value);
        el("span", { class: "n" }, row, r.label);
      }
      const b = box.getBoundingClientRect();
      const t = evtOrEl.getBoundingClientRect ? evtOrEl.getBoundingClientRect() : null;
      const cx = evtOrEl.clientX ?? (t.left + t.width / 2), cy = evtOrEl.clientY ?? t.top;
      tip.style.opacity = 1;
      const w = tip.offsetWidth;
      let left = cx - b.left + 12;
      if (left + w > b.width) left = cx - b.left - w - 12;
      tip.style.left = Math.max(0, left) + "px";
      tip.style.top = Math.max(0, cy - b.top - tip.offsetHeight - 8) + "px";
    },
    hide() { tip.style.opacity = 0; }
  };
}
function table(container, head, rows) {
  container.replaceChildren();
  const t = el("table", {}, container);
  const tr = el("tr", {}, el("thead", {}, t));
  head.forEach(h => el("th", {}, tr, h));
  const tb = el("tbody", {}, t);
  rows.forEach(r => { const row = el("tr", {}, tb); r.forEach(c => el("td", {}, row, c)); });
}
function legend(container, items) {
  container.replaceChildren();
  items.forEach(i => { const s = el("span", {}, container, i.label); s.style.setProperty("--c", i.color); });
}

// ---------- header + KPIs ----------
document.getElementById("subtitle").textContent =
  `GitHub contributions, public and private, ${dateName(S.window[0])} to ${dateName(S.window[1])}. Updated every Monday; last update ${dateName(S.date)}.`;
(function kpis() {
  const box = document.getElementById("kpis");
  const prev = H.length > 1 ? H[H.length - 2].people[hero.key] : null;
  const card = (cls, label, value, sub, delta) => {
    const c = el("div", { class: "card kpi " + cls }, box);
    el("div", { class: "label" }, c, label);
    el("div", { class: "value" }, c, value);
    const s = el("div", { class: "sub" }, c, sub);
    if (delta) el("span", { class: "delta" }, s, " " + delta);
  };
  const d = prev ? hero.total - prev.total : 0;
  card("hero", `${hero.name}, last 12 months`, fmt(hero.total), "contributions", prev && d ? `${d > 0 ? "+" : "−"}${fmt(Math.abs(d))} vs last week` : "");
  for (const b of hero.boards) {
    const meta = S.boards.find(x => x.key === b.key);
    const pr = prev && prev.ranks[b.key];
    const moved = pr && pr !== b.rank ? (pr > b.rank ? `▲ up ${pr - b.rank}` : `▼ down ${b.rank - pr}`) : "";
    card("", `Rank in ${meta.label}`, `#${b.rank}`, `among the top ${meta.listed} developers`, moved);
  }
  for (const o of others) {
    if (o.prs) card("", `${o.name}, last 12 months`, fmt(o.prs.reduce((a, b) => a + b, 0)), `merged PRs in ${S.pr_repo.split("/")[1]} (${hero.name}: ${fmt(hero.prs.reduce((a, b) => a + b, 0))})`);
    else card("", `${o.name}, last 12 months`, fmt(o.total), o.total ? "contributions" : "private contributions hidden on profile");
  }
})();

// ---------- monthly grouped columns ----------
const metrics = [];
if (S.pr_repo) metrics.push({ key: "prs", label: "Merged PRs", desc: `Pull requests merged into ${S.pr_repo} each month, by author.` + (people.length > 1 ? " The fairest like-for-like comparison." : "") });
document.getElementById("monthly-title").textContent = "Month by month: " + people.map(p => p.name).join(" and ");
metrics.push({ key: "months", label: "Contributions", desc: "GitHub contributions each month (commits, PRs, issues, reviews; public and private). An account only shows private work if its owner switches that on in profile settings." });
let metric = metrics[0].key;
const seg = document.getElementById("metric");
metrics.forEach(m => {
  const b = el("button", { type: "button", "aria-pressed": String(m.key === metric) }, seg, m.label);
  b.onclick = () => { metric = m.key; seg.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x === b))); drawMonthly(); };
});
if (metrics.length < 2) seg.style.display = "none";

function drawMonthly() {
  const m = metrics.find(x => x.key === metric);
  document.getElementById("monthly-desc").textContent = m.desc;
  const series = people.filter(p => p[metric]);
  // A single series needs no legend: the title names it.
  legend(document.getElementById("monthly-legend"), series.length > 1 ? series.map(p => ({ label: p.name, color: COLOR[p.key] })) : []);
  const box = document.getElementById("monthly");
  box.replaceChildren();
  const W = Math.max(320, box.clientWidth), Hh = 280, M = { t: 16, r: 8, b: 30, l: 44 };
  const svg = el("svg:svg", { viewBox: `0 0 ${W} ${Hh}`, role: "img", "aria-label": `Monthly ${m.label.toLowerCase()} by person` }, box);
  const tip = tooltip(box);
  const max = niceMax(Math.max(1, ...series.flatMap(p => p[metric])));
  const pw = W - M.l - M.r, ph = Hh - M.t - M.b;
  const y = v => M.t + ph - (v / max) * ph;
  for (let i = 0; i <= 4; i++) {
    const v = (max / 4) * i, yy = Math.round(y(v)) + 0.5;
    el("svg:line", { x1: M.l, x2: W - M.r, y1: yy, y2: yy, stroke: i ? "var(--grid)" : "var(--axis)" }, svg);
    el("svg:text", { x: M.l - 8, y: yy + 4, "text-anchor": "end", "font-size": 11, fill: "var(--muted)" }, svg, compact(v));
  }
  const n = S.months.length, slot = pw / n;
  const gw = Math.min(slot - 8, 24 * series.length + 2 * (series.length - 1));
  const bw = (gw - 2 * (series.length - 1)) / series.length;
  S.months.forEach((iso, i) => {
    const gx = M.l + i * slot + (slot - gw) / 2;
    const marks = series.map((p, k) => {
      const v = p[metric][i], h = Math.max(v ? 1.5 : 0, (v / max) * ph);
      return el("svg:path", { class: "mark", d: barPath(gx + k * (bw + 2), M.t + ph - h, bw, h), fill: COLOR[p.key] }, svg);
    });
    const showYear = i === 0 || iso.endsWith("-01-01");
    el("svg:text", { x: M.l + i * slot + slot / 2, y: Hh - 10, "text-anchor": "middle", "font-size": 11, fill: "var(--muted)" }, svg,
      W < 520 && i % 2 ? "" : monthName(iso) + (showYear && W >= 520 ? " ’" + iso.slice(2, 4) : ""));
    const hit = el("svg:rect", { class: "hit", x: M.l + i * slot, y: M.t, width: slot, height: ph, tabindex: 0 }, svg);
    const title = monthName(iso, true) + (i === n - 1 ? " (to date)" : "");
    const rows = series.map(p => ({ color: COLOR[p.key], value: fmt(p[metric][i]), label: p.name }));
    const on = e => { marks.forEach(x => x.style.opacity = 0.75); tip.show(e, title, rows); };
    const off = () => { marks.forEach(x => x.style.opacity = 1); tip.hide(); };
    hit.addEventListener("pointermove", on); hit.addEventListener("pointerleave", off);
    hit.addEventListener("focus", () => on(hit)); hit.addEventListener("blur", off);
  });
  table(document.getElementById("monthly-table"), ["Month", ...series.map(p => p.name)],
    S.months.map((iso, i) => [monthName(iso, true), ...series.map(p => fmt(p[metric][i]))]));
}

// ---------- leaderboards (emphasis: Jostein in accent, others de-emphasised) ----------
function drawBoards() {
  const wrap = document.getElementById("boards");
  wrap.replaceChildren();
  for (const meta of S.boards) {
    const b = hero.boards.find(x => x.key === meta.key);
    const sec = el("section", { class: "card" }, wrap);
    el("h2", {}, sec, `${meta.label}: top 10 and Jostein`);
    el("p", { class: "desc" }, sec, `Where ${fmt(hero.total)} contributions would place on committers.top's ${meta.label} list (all contributions, past year; list generated ${meta.generated ? dateName(meta.generated) : "recently"}).`);
    const rows = meta.users.slice(0, 10).map((u, i) => ({ rank: i + 1, label: u.name || u.login, login: u.login, v: u.contribs }));
    const me = { rank: b.rank, label: "Jostein (you)", v: hero.total, me: true };
    if (b.rank <= 10) { rows.splice(b.rank - 1, 0, me); rows.forEach((r, i) => { if (!r.me && i >= b.rank) r.rank = i + 1; }); rows.length = 11; }
    else rows.push({ gap: true }, me);
    const box = el("div", { class: "chart" }, sec);
    const W = Math.max(300, box.clientWidth || 480), rowH = 26, M = { t: 4, r: 64, b: 4, l: 150 };
    const Hh = M.t + M.b + rows.length * rowH;
    const svg = el("svg:svg", { viewBox: `0 0 ${W} ${Hh}`, role: "img", "aria-label": `${meta.label} leaderboard with Jostein at rank ${b.rank}` }, box);
    const tip = tooltip(box);
    const vals = rows.filter(r => !r.gap).map(r => r.v).sort((a, c) => c - a);
    // One extreme outlier would flatten every other bar: cap the axis and mark the cut bar.
    const cap = vals[0] > 3 * vals[1] ? vals[1] * 1.15 : vals[0];
    const pw = W - M.l - M.r;
    rows.forEach((r, i) => {
      const yy = M.t + i * rowH;
      if (r.gap) { el("svg:text", { x: M.l - 8, y: yy + 17, "text-anchor": "end", "font-size": 12, fill: "var(--muted)" }, svg, "⋮"); return; }
      const cut = r.v > cap, w = Math.max(2, (Math.min(r.v, cap) / cap) * pw);
      el("svg:text", { x: M.l - 8, y: yy + 17, "text-anchor": "end", "font-size": 12, fill: r.me ? "var(--ink)" : "var(--ink-2)", "font-weight": r.me ? 650 : 400 }, svg,
        `${r.rank}. ${r.label.length > 18 ? r.label.slice(0, 17) + "…" : r.label}`);
      const mark = el("svg:path", { class: "mark", d: barPath(M.l, yy + 5, w, 16, true), fill: r.me ? "var(--s1)" : "var(--deemph)" }, svg);
      if (cut) el("svg:path", { d: `M${M.l + w - 14},${yy + 3} l6,20 M${M.l + w - 8},${yy + 3} l6,20`, stroke: "var(--surface)", "stroke-width": 3 }, svg);
      el("svg:text", { x: M.l + w + 6, y: yy + 17, "font-size": 12, fill: r.me ? "var(--ink)" : "var(--ink-2)", "font-weight": r.me ? 650 : 400 }, svg, compact(r.v));
      const hit = el("svg:rect", { class: "hit", x: 0, y: yy, width: W, height: rowH, tabindex: 0 }, svg);
      const rowsTip = [{ color: r.me ? "var(--s1)" : "var(--deemph)", value: fmt(r.v), label: "contributions" }];
      const title = `#${r.rank} ${r.label}${r.login ? " (@" + r.login + ")" : ""}${cut ? " (bar shortened)" : ""}`;
      const on = e => { mark.style.opacity = 0.75; tip.show(e, title, rowsTip); };
      const off = () => { mark.style.opacity = 1; tip.hide(); };
      hit.addEventListener("pointermove", on); hit.addEventListener("pointerleave", off);
      hit.addEventListener("focus", () => on(hit)); hit.addEventListener("blur", off);
    });
    if (cap < vals[0]) el("p", { class: "note" }, sec, "The first bar is shortened (marked with a break) so the others stay readable.");
    const d = el("details", {}, sec); el("summary", {}, d, "Show data table");
    table(el("div", {}, d), ["Rank", "Developer", "Contributions"], rows.filter(r => !r.gap).map(r => [String(r.rank), r.label, fmt(r.v)]));
  }
}

// ---------- rank over time ----------
function drawTrend() {
  const box = document.getElementById("trend");
  box.replaceChildren();
  const series = S.boards.map((b, k) => ({ key: b.key, label: b.label, color: k ? "var(--s2)" : "var(--s1)",
    pts: H.map(h => ({ date: h.date, rank: h.people[hero.key]?.ranks?.[b.key] })).filter(p => p.rank) }));
  legend(document.getElementById("trend-legend"), series.map(s => ({ label: s.label, color: s.color })));
  table(document.getElementById("trend-table"), ["Week", ...series.map(s => s.label)],
    H.map(h => [dateName(h.date), ...series.map(s => h.people[hero.key]?.ranks?.[s.key] ? "#" + h.people[hero.key].ranks[s.key] : "–")]));
  if (H.length < 2) { el("div", { class: "empty" }, box, `The trend starts with the first snapshot on ${dateName(H[0].date)} and fills in with each Monday update.`); return; }
  const W = Math.max(320, box.clientWidth), Hh = 220, M = { t: 14, r: 90, b: 28, l: 40 };
  const svg = el("svg:svg", { viewBox: `0 0 ${W} ${Hh}`, role: "img", "aria-label": "Rank over time" }, box);
  const tip = tooltip(box);
  const all = series.flatMap(s => s.pts.map(p => p.rank));
  const lo = 1, hi = Math.max(5, Math.max(...all) + 1);
  const t0 = Date.parse(H[0].date), t1 = Date.parse(H[H.length - 1].date);
  const pw = W - M.l - M.r, ph = Hh - M.t - M.b;
  const x = d => M.l + ((Date.parse(d) - t0) / Math.max(1, t1 - t0)) * pw;
  const y = r => M.t + ((r - lo) / (hi - lo)) * ph;
  const ticks = [...new Set([1, Math.round(hi / 2), hi])];
  ticks.forEach(r => { const yy = Math.round(y(r)) + 0.5;
    el("svg:line", { x1: M.l, x2: M.l + pw, y1: yy, y2: yy, stroke: "var(--grid)" }, svg);
    el("svg:text", { x: M.l - 8, y: yy + 4, "text-anchor": "end", "font-size": 11, fill: "var(--muted)" }, svg, "#" + r); });
  [H[0].date, H[H.length - 1].date].forEach((d, i) => el("svg:text", { x: x(d), y: Hh - 8, "text-anchor": i ? "end" : "start", "font-size": 11, fill: "var(--muted)" }, svg, dateName(d)));
  series.forEach(s => {
    if (!s.pts.length) return;
    el("svg:path", { d: s.pts.map((p, i) => `${i ? "L" : "M"}${x(p.date)},${y(p.rank)}`).join(""), fill: "none", stroke: s.color, "stroke-width": 2, "stroke-linejoin": "round", "stroke-linecap": "round" }, svg);
    const last = s.pts[s.pts.length - 1];
    el("svg:circle", { cx: x(last.date), cy: y(last.rank), r: 4, fill: s.color, stroke: "var(--surface)", "stroke-width": 2 }, svg);
    el("svg:text", { x: x(last.date) + 10, y: y(last.rank) + 4, "font-size": 12, fill: "var(--ink-2)" }, svg, `${s.label} #${last.rank}`);
  });
  const cross = el("svg:line", { y1: M.t, y2: M.t + ph, stroke: "var(--axis)", opacity: 0 }, svg);
  const hit = el("svg:rect", { class: "hit", x: M.l, y: M.t, width: pw, height: ph }, svg);
  hit.addEventListener("pointermove", e => {
    const r = svg.getBoundingClientRect(), px = (e.clientX - r.left) * (W / r.width);
    const h = H.reduce((a, c) => Math.abs(x(c.date) - px) < Math.abs(x(a.date) - px) ? c : a);
    cross.setAttribute("x1", x(h.date)); cross.setAttribute("x2", x(h.date)); cross.setAttribute("opacity", 1);
    tip.show(e, dateName(h.date), series.map(s => ({ color: s.color, value: h.people[hero.key]?.ranks?.[s.key] ? "#" + h.people[hero.key].ranks[s.key] : "–", label: s.label })));
  });
  hit.addEventListener("pointerleave", () => { cross.setAttribute("opacity", 0); tip.hide(); });
}

// ---------- notes ----------
(function notes() {
  const ul = document.getElementById("notes");
  const li = (t, href, linkText) => { const l = el("li", {}, ul, t); if (href) { l.append(" "); el("a", { href }, l, linkText); } };
  const accts = people.map(p => `${p.name}: ${Object.keys(p.accounts).map(a => "@" + a).join(" + ")}`).join("; ");
  li(`Accounts counted, combined per person. ${accts}.`);
  li("Contributions are GitHub's own count from each profile's calendar, the same number committers.top ranks on.");
  li("Leaderboard places are where the total would sit on the published lists. Jostein is not listed on them himself, and they only include developers whose GitHub location names that country.", "https://committers.top", "committers.top");
  if (S.pr_repo) li(`Merged PRs are counted from ${S.pr_repo}, by the account that opened each PR` +
    (S.pr_as_of && S.pr_as_of !== S.date ? `; counts as of ${dateName(S.pr_as_of)}.` : "."));
  li("Generated by a weekly GitHub Action in this repository.", "https://github.com/josteins/josteins/tree/master/rankings", "Source");
})();

let lastW = 0;
function drawAll() { drawMonthly(); drawBoards(); drawTrend(); }
drawAll();
addEventListener("resize", () => { const w = document.querySelector("main").clientWidth; if (Math.abs(w - lastW) > 24) { lastW = w; drawAll(); } });
</script>
